name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24, not the 20 in `engines`. That field describes the runtime a user's
      # n8n needs to run the built node; this is the toolchain that builds it, and
      # @n8n/node-cli pulls in isolated-vm, which requires 24.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Runs the same ruleset as n8n's submission scanner; see eslint.config.mjs.
      # A finding here is a finding that would otherwise only surface after a
      # release, because the scanner can only read published packages.
      - name: Lint
        run: npm run lint

      - name: Confirm the package contents
        run: npm pack --dry-run
