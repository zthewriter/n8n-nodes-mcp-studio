name: Publish to npm

# Publishing runs here rather than from a laptop because n8n has required an npm
# provenance attestation for verified community nodes since 1 May 2026, and
# provenance can only be minted by a CI job holding a short-lived OIDC token.
# `scripts/assert-ci-publish.mjs` refuses a publish started anywhere else, since
# 0.3.0 went out from a laptop and reached npm before this workflow could run.
#
# Release by bumping the version in a pull request, merging it, then tagging the
# merged commit:
#   npm run release
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  # Mints the OIDC token that Sigstore signs the provenance attestation with.
  # Without it, `npm publish --provenance` fails.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24 rather than the 20 in `engines`: that field is the runtime a user's
      # n8n needs, this is the toolchain. @n8n/node-cli needs 24, and 24 ships
      # npm 11, which is the floor for OIDC trusted publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Required for npm auth even when the token comes from a secret.
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The same ruleset n8n's submission scanner applies; see eslint.config.mjs.
      - name: Lint
        run: npm run lint

      # Catches the mismatch that silently publishes the wrong version: a tag of
      # 0.2.0 against a package.json still saying 0.1.0.
      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify NODE_VERSION matches package.json
        run: npm run check:version

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
