name: Publish to npm

# Publishing runs here rather than from a laptop because n8n has required an npm
# provenance attestation for verified community nodes since 1 May 2026, and
# provenance can only be minted by a CI job holding a short-lived OIDC token.
#
# Release by pushing a tag that matches the version in package.json:
#   npm version patch && git push --follow-tags
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  # Mints the OIDC token that Sigstore signs the provenance attestation with.
  # Without it, `npm publish --provenance` fails.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Required for npm auth even when the token comes from a secret.
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint against the publish ruleset
        run: npx eslint -c .eslintrc.prepublish.js nodes credentials package.json

      - name: Lint against n8n's verification checks
        run: npm run lint:n8n

      # Catches the mismatch that silently publishes the wrong version: a tag of
      # 0.2.0 against a package.json still saying 0.1.0.
      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
